# VegaLand log döngüsü → /etc/logrotate.d/vegaland
# ŞABLON: @KOK@ ve @KULLANICI@ kur.sh tarafından doldurulur.
#
# NEDEN: 2026-07-27'de disk doldu, Postgres salt-okunura düştü ve proje
# saatlerce yerde kaldı. hasat-runner.mjs kendi loglarını buduyor,
# geo-turu-vps.sh de parti loglarını buduyor; bu dosya ÜÇÜNCÜ kat güvence —
# budayıcıları atlayan her .log dosyasını da sınırlar.

@KOK@/scraper/logs/*.log
@KOK@/scraper/logs/*/*.log
{
    daily
    rotate 7
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su @KULLANICI@ @KULLANICI@
    create 0640 @KULLANICI@ @KULLANICI@
}
